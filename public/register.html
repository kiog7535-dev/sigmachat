<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sigma Chat — Register</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">⚡</div>
      <h1 class="auth-title">Create an account</h1>
      <p class="auth-subtitle">Join Sigma Chat today</p>
      <div id="auth-error" class="auth-error hidden"></div>
      <form id="register-form">
        <div class="form-group">
          <label for="username">USERNAME</label>
          <input type="text" id="username" placeholder="Choose a username" autocomplete="username" required minlength="2" maxlength="32" />
        </div>
        <div class="form-group">
          <label for="password">PASSWORD</label>
          <input type="password" id="password" placeholder="Create a password" autocomplete="new-password" required minlength="4" />
        </div>
        <div class="form-group">
          <label for="confirm">CONFIRM PASSWORD</label>
          <input type="password" id="confirm" placeholder="Confirm your password" autocomplete="new-password" required />
        </div>
        <button type="submit" class="auth-btn" id="register-btn">Create Account</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="/login.html">Login</a></p>
    </div>
    <div class="auth-bg-art">
      <div class="bg-blob blob-1"></div>
      <div class="bg-blob blob-2"></div>
      <div class="bg-blob blob-3"></div>
    </div>
  </div>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('register-btn');
      const errEl = document.getElementById('auth-error');
      const pw = document.getElementById('password').value;
      const cp = document.getElementById('confirm').value;
      if (pw !== cp) {
        errEl.textContent = 'Passwords do not match';
        errEl.classList.remove('hidden');
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Creating account...';
      errEl.classList.add('hidden');
      try {
        const res = await fetch('/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: pw
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Registration failed');
        window.location.href = '/';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
